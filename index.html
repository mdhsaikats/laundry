<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaundryPro - Premium Laundry Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black min-h-screen">
    <!-- Auth Screen -->
    <div id="auth-screen" class="min-h-screen bg-black flex items-center justify-center px-4">
        <div class="max-w-md w-full">
            <div class="bg-zinc-900 rounded-2xl shadow-2xl p-8 border border-zinc-800">
                <div class="text-center mb-8">
                    <h1 class="text-4xl font-bold text-white mb-2">LaundryPro</h1>
                    <p class="text-zinc-400">Premium laundry service at your doorstep</p>
                </div>

                <form id="auth-form" class="space-y-6">
                    <div id="fullname-field" class="hidden">
                        <label for="fullName" class="block text-sm font-medium text-zinc-300 mb-2">Full Name</label>
                        <input id="fullName" type="text" placeholder="John Doe"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div id="phone-field" class="hidden">
                        <label for="phone" class="block text-sm font-medium text-zinc-300 mb-2">Phone Number</label>
                        <input id="phone" type="tel" placeholder="+1 (555) 123-4567"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div id="address-field" class="hidden">
                        <label for="address" class="block text-sm font-medium text-zinc-300 mb-2">Address</label>
                        <textarea id="address" rows="2" placeholder="123 Main St, City, State, ZIP"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none"></textarea>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-zinc-300 mb-2">Email</label>
                        <input id="email" type="email" required placeholder="you@example.com"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
                        <input id="password" type="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div id="error-message" class="hidden bg-red-900/20 border border-red-900/50 text-red-400 px-4 py-3 rounded-lg text-sm"></div>

                    <button type="submit" id="auth-submit-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="auth-btn-text">Sign In</span>
                        <span id="auth-loading" class="hidden">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <button id="toggle-auth-mode" class="text-emerald-400 hover:text-emerald-300 text-sm transition">
                        Don't have an account? Sign up
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="hidden min-h-screen bg-black">
        <!-- Header -->
        <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <h1 class="text-3xl font-bold text-white">LaundryPro</h1>
                    <button id="signout-btn" class="flex items-center gap-2 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                        Sign Out
                    </button>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Tab Navigation -->
            <div class="flex gap-4 mb-8">
                <button id="new-order-tab" class="tab-btn active flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="21" r="1"></circle>
                        <circle cx="19" cy="21" r="1"></circle>
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                    </svg>
                    New Order
                </button>
                <button id="history-tab" class="tab-btn flex items-center gap-2 px-6 py-3 rounded-lg font-semibold transition">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                        <path d="M12 7v5l4 2"></path>
                    </svg>
                    Order History
                </button>
            </div>

            <!-- New Order Tab Content -->
            <div id="new-order-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left Column: Item Selector -->
                <div class="lg:col-span-2 space-y-8">
                    <!-- Select Clothing Type -->
                    <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                        <h2 class="text-2xl font-bold text-white mb-6">Select Clothing Type</h2>
                        <div id="items-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                            <!-- Items will be dynamically loaded here -->
                        </div>
                    </div>

                    <!-- Quantity Selector (Hidden by default) -->
                    <div id="quantity-section" class="hidden bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                        <h2 class="text-2xl font-bold text-white mb-6">Select Quantity</h2>
                        <div class="flex items-center justify-center gap-6">
                            <button id="qty-minus" class="w-12 h-12 rounded-full bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                            <span id="quantity-display" class="text-4xl font-bold text-white w-20 text-center">1</span>
                            <button id="qty-plus" class="w-12 h-12 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center transition">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Service Selector (Hidden by default) -->
                    <div id="services-section" class="hidden bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                        <h2 class="text-2xl font-bold text-white mb-6">Select Services</h2>
                        <div id="services-list" class="space-y-3">
                            <!-- Services will be dynamically loaded here -->
                        </div>
                    </div>

                    <!-- Add to Cart Button (Hidden by default) -->
                    <div id="add-to-cart-section" class="hidden bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-zinc-400">Item Total</span>
                            <span id="item-total" class="text-3xl font-bold text-emerald-400">$0.00</span>
                        </div>
                        <button id="add-to-cart-btn" disabled
                            class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-zinc-700 disabled:cursor-not-allowed text-white font-semibold py-4 px-6 rounded-lg transition duration-200">
                            Select at least one service
                        </button>
                    </div>
                </div>

                <!-- Right Column: Order Summary -->
                <div class="lg:col-span-1">
                    <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800 sticky top-24">
                        <div class="flex items-center gap-2 mb-6">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400">
                                <circle cx="8" cy="21" r="1"></circle>
                                <circle cx="19" cy="21" r="1"></circle>
                                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                            </svg>
                            <h2 class="text-2xl font-bold text-white">Order Summary</h2>
                        </div>

                        <div id="cart-empty" class="text-center py-12">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-700 mx-auto mb-4">
                                <circle cx="8" cy="21" r="1"></circle>
                                <circle cx="19" cy="21" r="1"></circle>
                                <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
                            </svg>
                            <p class="text-zinc-500">Your cart is empty</p>
                        </div>

                        <div id="cart-items" class="hidden">
                            <div id="cart-list" class="space-y-4 mb-6 max-h-96 overflow-y-auto">
                                <!-- Cart items will be dynamically loaded here -->
                            </div>

                            <div class="mb-6">
                                <label for="pickup-address" class="block text-sm font-medium text-zinc-300 mb-2">Pickup Address *</label>
                                <textarea id="pickup-address" rows="2" required placeholder="Enter your pickup address..."
                                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none"></textarea>
                            </div>

                            <div class="mb-6">
                                <label for="delivery-address" class="block text-sm font-medium text-zinc-300 mb-2">Delivery Address *</label>
                                <textarea id="delivery-address" rows="2" required placeholder="Enter your delivery address (can be same as pickup)..."
                                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none"></textarea>
                                <button type="button" id="same-as-pickup-btn" class="mt-2 text-sm text-emerald-400 hover:text-emerald-300 transition">
                                    Same as pickup address
                                </button>
                            </div>

                            <div class="mb-6">
                                <label for="order-notes" class="block text-sm font-medium text-zinc-300 mb-2">Special Instructions</label>
                                <textarea id="order-notes" rows="3" placeholder="Any special requests or instructions..."
                                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition resize-none"></textarea>
                            </div>

                            <div class="border-t border-zinc-700 pt-4 mb-6">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-zinc-400">Total Amount</span>
                                    <span id="cart-total" class="text-3xl font-bold text-emerald-400">$0.00</span>
                                </div>
                            </div>

                            <button id="place-order-btn"
                                class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-zinc-700 disabled:cursor-not-allowed text-white font-semibold py-4 px-6 rounded-lg transition duration-200 flex items-center justify-center">
                                <span id="place-order-text">Place Order</span>
                                <span id="place-order-loading" class="hidden">
                                    <svg class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    Placing Order...
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order History Tab Content -->
            <div id="history-content" class="hidden space-y-6">
                <h2 class="text-2xl font-bold text-white mb-6">Your Orders</h2>
                <div id="orders-list">
                    <!-- Orders will be dynamically loaded here -->
                </div>
                <div id="orders-empty" class="hidden bg-zinc-900 rounded-xl p-12 border border-zinc-800 text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-700 mx-auto mb-4">
                        <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <h3 class="text-xl font-semibold text-white mb-2">No orders yet</h3>
                    <p class="text-zinc-400">Create your first laundry order to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
