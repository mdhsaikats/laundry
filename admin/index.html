<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaundryPro Admin - Order Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-black min-h-screen">
    <!-- Admin Login Screen -->
    <div id="admin-login-screen" class="min-h-screen bg-black flex items-center justify-center px-4">
        <div class="max-w-md w-full">
            <div class="bg-zinc-900 rounded-2xl shadow-2xl p-8 border border-zinc-800">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-600 rounded-full mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </div>
                    <h1 class="text-4xl font-bold text-white mb-2">Admin Portal</h1>
                    <p class="text-zinc-400">LaundryPro Management System</p>
                </div>

                <form id="admin-login-form" class="space-y-6">
                    <div>
                        <label for="admin-email" class="block text-sm font-medium text-zinc-300 mb-2">Admin Email</label>
                        <input id="admin-email" type="email" required placeholder="admin@laundrypro.com"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div>
                        <label for="admin-password" class="block text-sm font-medium text-zinc-300 mb-2">Password</label>
                        <input id="admin-password" type="password" required placeholder="••••••••"
                            class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition">
                    </div>

                    <div id="admin-error-message" class="hidden bg-red-900/20 border border-red-900/50 text-red-400 px-4 py-3 rounded-lg text-sm"></div>

                    <button type="submit" id="admin-login-btn"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center">
                        <span id="admin-login-text">Sign In</span>
                        <span id="admin-login-loading" class="hidden">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden min-h-screen bg-black">
        <!-- Header -->
        <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="inline-flex items-center justify-center w-10 h-10 bg-emerald-600 rounded-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white">
                                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white">Admin Dashboard</h1>
                            <p class="text-sm text-zinc-400">Order Management System</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button id="refresh-btn" class="flex items-center gap-2 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                            Refresh
                        </button>
                        <button id="admin-signout-btn" class="flex items-center gap-2 px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg transition">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-zinc-400 text-sm font-medium">Total Orders</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400">
                            <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        </svg>
                    </div>
                    <div class="text-3xl font-bold text-white" id="stat-total">0</div>
                </div>
                
                <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-zinc-400 text-sm font-medium">Pending</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-yellow-400">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="text-3xl font-bold text-white" id="stat-pending">0</div>
                </div>
                
                <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-zinc-400 text-sm font-medium">In Progress</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="text-3xl font-bold text-white" id="stat-processing">0</div>
                </div>
                
                <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-zinc-400 text-sm font-medium">Completed</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-400">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <div class="text-3xl font-bold text-white" id="stat-completed">0</div>
                </div>
            </div>

            <!-- Search and Filter Section -->
            <div class="bg-zinc-900 rounded-xl p-6 border border-zinc-800 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-zinc-300 mb-2">Search Orders</label>
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="Search by customer name, email, or order ID..."
                                class="w-full px-4 py-3 pl-10 bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-3.5 text-zinc-500">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-300 mb-2">Filter by Status</label>
                        <select id="status-filter" aria-label="Filter by Status" class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="processing">Processing</option>
                            <option value="ready">Ready for Pickup</option>
                            <option value="delivered">Delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="flex flex-wrap gap-3 mb-6">
                <button data-status="all" class="filter-btn active px-4 py-2 rounded-lg font-medium transition">
                    All Orders
                </button>
                <button data-status="pending" class="filter-btn px-4 py-2 rounded-lg font-medium transition">
                    Pending
                </button>
                <button data-status="processing" class="filter-btn px-4 py-2 rounded-lg font-medium transition">
                    Processing
                </button>
                <button data-status="ready" class="filter-btn px-4 py-2 rounded-lg font-medium transition">
                    Ready for Pickup
                </button>
                <button data-status="delivered" class="filter-btn px-4 py-2 rounded-lg font-medium transition">
                    Delivered
                </button>
                <button data-status="cancelled" class="filter-btn px-4 py-2 rounded-lg font-medium transition">
                    Cancelled
                </button>
            </div>

            <!-- Orders Table -->
            <div class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead class="bg-zinc-800 border-b border-zinc-700">
                            <tr>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Order ID</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Customer</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Items</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Total</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Status</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Date</th>
                                <th class="text-left px-6 py-4 text-xs font-semibold text-zinc-300 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-zinc-800">
                            <!-- Orders will be dynamically loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="no-orders" class="hidden text-center py-12">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-zinc-700 mx-auto mb-4">
                        <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    </svg>
                    <p class="text-zinc-500 text-lg">No orders found</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="order-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-900 rounded-2xl border border-zinc-800 max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-white">Order Details</h2>
                <button id="close-modal-btn" class="text-zinc-400 hover:text-white transition" title="Close Modal" aria-label="Close Modal">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div id="modal-content" class="p-6">
                <!-- Modal content will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
